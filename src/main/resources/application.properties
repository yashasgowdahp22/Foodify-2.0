spring.application.name=foodify

# Dynamic port binding: defaults to 8080 locally, overridden by Render's $PORT on cloud
server.port=${PORT:8080}

# Database Configuration: defaults to local MySQL, overridden by cloud env vars
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodify}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Production frontend URL: defaults to local Vite port (http://localhost:5173)
frontend.url=${FRONTEND_URL:http://localhost:5173}
